[package]
name = "null-jsfx-hub"
description = "NULL JSFX Hub: install, update and remove the NULL JSFX plugins"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "null-jsfx-hub"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
null_hub_core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
