[package]
name = "null_hub_core"
description = "What NULL JSFX Hub does without its window: catalog, what is installed, install, update, remove"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier", "win-system-proxy"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
dirs = "6"
flate2 = "1"

[dev-dependencies]
tempfile = "3"
