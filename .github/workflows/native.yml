name: VST3 and CLAP

# Builds the VST3/CLAP plugins (native/) for Windows, macOS and Linux, checks on Linux and macOS
# that each one sounds identical to its JSFX, and uploads one "NULL-JSFX-<os>" package per OS
# with the JSFX (plain and GFX), VST3 and CLAP versions and native/INSTALL.txt.

on:
  push:
    paths: ["native/**", "DATA/**", "tests/**", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "DATA/**", "tests/**", ".github/workflows/native.yml"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: linux, test: "--test" }
          - { os: macos-14, name: macos, test: "--test" }
          - { os: windows-2022, name: windows, test: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config nasm \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev libdbus-1-dev

      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja nasm

      - name: Build
        run: native/scripts/build.sh ${{ matrix.test }}

      - name: Package
        run: |
          out="NULL-JSFX-${{ matrix.name }}"
          mkdir -p "$out/JSFX"
          cp -R DATA/Effects/null_jsfx "$out/JSFX/"
          cp -R native/dist/VST3 native/dist/CLAP "$out/"
          cp native/INSTALL.txt "$out/"

      - uses: actions/upload-artifact@v4
        with:
          name: NULL-JSFX-${{ matrix.name }}
          path: NULL-JSFX-${{ matrix.name }}
