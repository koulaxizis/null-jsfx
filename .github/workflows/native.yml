name: VST3 and CLAP

# Builds the VST3/CLAP plugins (native/) for Windows, macOS and Linux, checks on Linux and macOS
# that each one sounds identical to its JSFX, and uploads these packages:
#   NULL-JSFX-JSFX                 the JSFX (plain and GFX) and the tablet remote (Remote/),
#                                  the same for every OS
#   NULL-JSFX-VST3-CLAP-<OS>       the VST3 and CLAP versions for Windows, macOS or Linux (Linux: also LV2);
#                                  Windows-ARM64 and Linux-ARM64 for ARM computers (macOS is universal)
# each with native/INSTALL.txt, and from those the installers where the user picks formats,
# plugins and extras (tools/build_installer.py, installer/):
#   NULL-JSFX-Installer-Windows.exe, NULL-JSFX-Installer-Linux.sh, NULL-JSFX-Installer-macOS.pkg,
#   NULL-JSFX-Installer-macOS.sh, NULL-JSFX-Installer-Windows-ARM64.exe, NULL-JSFX-Installer-Linux-ARM64.sh
# each installed and checked here. With a release tag (the Release workflow, which builds a draft
# release, or a run by hand for a release that already exists) they are attached to that release,
# the packages as zips with these names (the site's Download links use
# releases/latest/download/<name>; each upload is retried, since the upload endpoint can answer
# HTTP 500 for a while). Job validate runs the official validators (pluginval, clap-validator)
# on every plugin on Windows and Linux; a failure fails the run.

on:
  push:
    branches: [main]
    paths: ["native/**", "DATA/**", "remote/**", "tests/run.sh", "tests/installer_test.sh", "tests/pkg_test.sh", "installer/**", "tools/build_installer.py", ".github/workflows/native.yml"]
  pull_request:
    paths: ["native/**", "DATA/**", "remote/**", "tests/run.sh", "tests/installer_test.sh", "tests/pkg_test.sh", "installer/**", "tools/build_installer.py", ".github/workflows/native.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the packages and installers to this existing release (e.g. 2.1); empty = only build"
        required: false
        default: ""
  # from release.yml, which creates the draft release first
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true

# Pull requests run on every push to their branch; a newer push cancels the older run of the same
# PR. Pushes run only on main, so a branch with a PR is not built twice. Runs on main, releases
# and manual runs each get their own group, so they are never cancelled or queued (release
# uploads always finish). The group name is fixed rather than github.workflow, which is the
# caller's name when release.yml calls this workflow and would put both called workflows in one group.
concurrency:
  group: vst3-clap-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the jobs that attach packages to a release may write.
permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: Linux, test: "--test" }
          - { os: macos-15, name: macOS, test: "--test" }
          - { os: windows-2022, name: Windows, test: "" }
          # ARM64 (Bible B17): Windows on Arm and Linux arm64, each on its own runner, built without
          # the comparison tests: ysfx on Linux arm64 rounds a few results by one float ulp, so the
          # exact (tolerance 0) checks fail there; the sound is checked on an ARM CPU by macOS
          # (Apple Silicon), which runs every test
          - { os: ubuntu-22.04-arm, name: Linux-ARM64, test: "" }
          - { os: windows-11-arm, name: Windows-ARM64, test: "" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      # ysfx for the comparison tests (built by tests/run.sh --build-only), per OS image
      - uses: actions/cache@v6
        if: matrix.test != ''
        with:
          path: tests/.build/ysfx
          key: ysfx-${{ matrix.os }}-${{ hashFiles('tests/run.sh') }}

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build git pkg-config nasm \
            libgl1-mesa-dev libx11-dev libxcursor-dev libxext-dev libxrandr-dev libdbus-1-dev

      - name: macOS deps
        if: runner.os == 'macOS'
        run: brew install ninja nasm

      - name: Build
        run: native/scripts/build.sh ${{ matrix.test }}

      - name: Check the LV2 plugins against the JSFX (lilv)
        if: runner.os == 'Linux'
        run: |
          # lv2_test.py needs numpy; the runner's system python3 has none
          sudo apt-get install -y liblilv-0-0 python3-numpy
          b=tests/.build
          g++ -O2 -std=c++17 -I "$b/ysfx/include" web/test/render_ref.cpp "$b/ysfx/build/libysfx.a" -lpthread -ldl -o "$b/render_ref"
          python3 native/test/lv2_test.py native/dist/LV2/"NULL JSFX"

      - name: Package
        run: |
          out="NULL-JSFX-VST3-CLAP-${{ matrix.name }}"
          mkdir -p "$out"
          cp -R native/dist/VST3 native/dist/CLAP "$out/"
          if [ -d native/dist/LV2 ]; then cp -R native/dist/LV2 "$out/"; fi
          cp native/INSTALL.txt "$out/"

      - uses: actions/upload-artifact@v7
        with:
          name: NULL-JSFX-VST3-CLAP-${{ matrix.name }}
          path: NULL-JSFX-VST3-CLAP-${{ matrix.name }}
          retention-days: 14

      - name: Attach to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="NULL-JSFX-VST3-CLAP-${{ matrix.name }}"
          if [ "$RUNNER_OS" = Windows ]; then
            # 7-Zip writes "/" between folders as the zip format requires; Compress-Archive wrote
            # "\\" until 2026-11-01, which some unzip tools keep as part of the file name
            7z a -tzip -bd "$out.zip" "$out" > /dev/null
          else
            zip -qry "$out.zip" "$out"
          fi
          ${{ runner.os == 'Windows' && 'python' || 'python3' }} -c "import sys, zipfile; bad = [n for n in zipfile.ZipFile(sys.argv[1]).namelist() if '\\\\' in n]; sys.exit(f'backslash in {bad[:3]}' if bad else 0)" "$out.zip"
          for i in 1 2 3 4 5; do gh release upload "${{ inputs.release_tag }}" "$out.zip" --clobber && exit 0; sleep $((i * 30)); done; exit 1

  jsfx:
    permissions:
      contents: write
    timeout-minutes: 15
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - name: Package
        run: |
          out="NULL-JSFX-JSFX"
          mkdir -p "$out"
          cp -R DATA/Effects/null_jsfx "$out/"
          # presets as REAPER user preset files (presets/js-*.ini) instead of the .rpl libraries,
          # which REAPER only reads when imported by hand
          find "$out/null_jsfx" -name '*.rpl' -delete
          python3 tools/build_presets.py --ini "$out/presets"
          cp -R DATA/FXChains "$out/FXChains"
          mkdir -p "$out/fonts"
          cp native/common/fonts/* "$out/fonts/"
          cp native/INSTALL.txt "$out/"
          mkdir -p "$out/Remote"
          cp -R remote/reaper_www_root remote/Scripts remote/INSTALL.txt remote/bitwig remote/ableton "$out/Remote/"

      - uses: actions/upload-artifact@v7
        with:
          name: NULL-JSFX-JSFX
          path: NULL-JSFX-JSFX
          retention-days: 14

      - name: Attach to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -qry NULL-JSFX-JSFX.zip NULL-JSFX-JSFX
          for i in 1 2 3 4 5; do gh release upload "${{ inputs.release_tag }}" NULL-JSFX-JSFX.zip --clobber && exit 0; sleep $((i * 30)); done; exit 1

  installer-windows:
    needs: [build, jsfx]
    permissions:
      contents: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, name: Windows, arch: x64 }
          - { os: windows-11-arm, name: Windows-ARM64, arch: arm64 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: NULL-JSFX-JSFX
          path: pkg/NULL-JSFX-JSFX

      - uses: actions/download-artifact@v8
        with:
          name: NULL-JSFX-VST3-CLAP-${{ matrix.name }}
          path: pkg/NULL-JSFX-VST3-CLAP-${{ matrix.name }}

      - name: Build
        run: |
          version="${{ inputs.release_tag }}"
          version="${version:-dev}"
          python tools/build_installer.py --os Windows --arch ${{ matrix.arch }} --jsfx pkg/NULL-JSFX-JSFX \
            --native pkg/NULL-JSFX-VST3-CLAP-${{ matrix.name }} --version "$version" --out build-installer
          iscc="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          if [ ! -f "$iscc" ]; then
            choco install innosetup -y --no-progress
          fi
          (cd build-installer && "$iscc" //Q "//DAppVersion=$version" null_jsfx.iss)

      - name: Install, check and uninstall
        shell: pwsh
        run: |
          $setup = "build-installer\NULL-JSFX-Installer-${{ matrix.name }}.exe"
          $reaper = "$env:RUNNER_TEMP\REAPER"
          # a preset the user saved on Tilt: it must stay, with ours added after it
          $mine = "$reaper\presets\js-null_jsfx_tilt_jsfx.ini"
          New-Item -ItemType Directory -Force "$reaper\presets" | Out-Null
          Set-Content $mine "[General]`r`nNbPresets=1`r`n`r`n[Preset0]`r`nData=31202D2074657374E5`r`nLen=8`r`nName=Mine`r`n"
          $p = Start-Process $setup -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART',
            '/COMPONENTS="fmt\jsfx,fmt\gfx,fmt\vst3,extra\chains,*fx\oneslider,fx\essentials\delay"', "/REAPERDIR=`"$reaper`"", "/LOG=`"$env:RUNNER_TEMP\setup.log`""
          if ($p.ExitCode -ne 0) { Get-Content "$env:RUNNER_TEMP\setup.log"; throw "setup exit code $($p.ExitCode)" }
          $vst3 = "$env:CommonProgramFiles\VST3\NULL JSFX"
          $clap = "$env:CommonProgramFiles\CLAP\NULL JSFX"
          $fx = "$reaper\Effects\null_jsfx"
          $jsfx = (Get-ChildItem "$fx\*.jsfx").Count
          $gfx = (Get-ChildItem "$fx\gfx\*_gfx.jsfx").Count
          $v = (Get-ChildItem "$vst3\*.vst3").Count
          $chains = (Get-ChildItem "$reaper\FXChains\NULL JSFX\*.RfxChain" -ErrorAction SilentlyContinue).Count
          "JSFX $jsfx, GFX $gfx, VST3 $v, chains $chains, CLAP present: $(Test-Path $clap)"
          # One Slider (counted from the repo, so a new one needs no edit here) plus Delay
          $want = (Select-String -Path "DATA\Effects\null_jsfx\*.jsfx" -Pattern '^//category: One Slider' -List).Count + 1
          if ($jsfx -ne $want -or $gfx -ne $want -or $v -ne $want) { throw "expected $want plugins (One Slider + Delay) in each format" }
          if (-not (Test-Path "$fx\gfx\null_gfx.jsfx-inc")) { throw "null_gfx.jsfx-inc missing" }
          if (-not (Test-Path "$vst3\null_jsfx_delay.vst3\Contents")) { throw "VST3 bundle not copied whole" }
          if (Test-Path $clap) { throw "CLAP was not selected" }
          $ini = (Get-ChildItem "$reaper\presets\js-null_jsfx_*.ini").Count
          if ($ini -ne 2 * $want) { throw "expected $(2 * $want) preset files ($want JSFX + $want GFX), got $ini" }
          $names = (Select-String -Path $mine -Pattern '^Name=(.*)$' | ForEach-Object { $_.Matches[0].Groups[1].Value })
          $nb = (Select-String -Path $mine -Pattern '^NbPresets=(\d+)$').Matches[0].Groups[1].Value
          "Tilt presets: $($names -join ', ') (NbPresets=$nb)"
          if ($names[0] -ne 'Mine' -or $names[1] -ne 'Default' -or [int]$nb -ne $names.Count) { throw "presets not merged" }
          $u = Start-Process "$env:ProgramFiles\NULL JSFX\unins000.exe" -Wait -PassThru -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES'
          Start-Sleep -Seconds 3
          if ((Test-Path "$fx\tilt.jsfx") -or (Test-Path "$vst3\null_jsfx_tilt.vst3")) { throw "uninstall left plugins behind" }
          "installed and removed cleanly"

      - uses: actions/upload-artifact@v7
        with:
          name: NULL-JSFX-Installer-${{ matrix.name }}
          path: build-installer/NULL-JSFX-Installer-${{ matrix.name }}.exe
          retention-days: 14

      - name: Attach to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: for i in 1 2 3 4 5; do gh release upload "${{ inputs.release_tag }}" build-installer/NULL-JSFX-Installer-${{ matrix.name }}.exe --clobber && exit 0; sleep $((i * 30)); done; exit 1

  installer-unix:
    needs: [build, jsfx]
    permissions:
      contents: write
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, name: Linux, os_name: Linux, arch: x64 }
          - { os: macos-15, name: macOS, os_name: macOS, arch: universal }
          - { os: ubuntu-22.04-arm, name: Linux-ARM64, os_name: Linux, arch: arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: NULL-JSFX-JSFX
          path: pkg/NULL-JSFX-JSFX

      - uses: actions/download-artifact@v8
        with:
          name: NULL-JSFX-VST3-CLAP-${{ matrix.name }}
          path: pkg/NULL-JSFX-VST3-CLAP-${{ matrix.name }}

      - name: Build
        run: |
          version="${{ inputs.release_tag }}"
          python3 tools/build_installer.py --os ${{ matrix.os_name }} --arch ${{ matrix.arch }} --jsfx pkg/NULL-JSFX-JSFX \
            --native pkg/NULL-JSFX-VST3-CLAP-${{ matrix.name }} --version "${version:-dev}" --out build-installer

      - name: Install, check and uninstall
        # /bin/bash on macOS is bash 3.2, the one users have
        run: /bin/bash tests/installer_test.sh build-installer/NULL-JSFX-Installer-${{ matrix.name }}.sh

      - name: Install, check and uninstall the .pkg
        if: matrix.name == 'macOS'
        run: /bin/bash tests/pkg_test.sh build-installer/pkg-build build-installer/NULL-JSFX-Installer-macOS.pkg

      - uses: actions/upload-artifact@v7
        with:
          name: NULL-JSFX-Installer-${{ matrix.name }}
          path: build-installer/NULL-JSFX-Installer-${{ matrix.name }}.*
          retention-days: 14

      - name: Attach to the release
        if: inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: for i in 1 2 3 4 5; do gh release upload "${{ inputs.release_tag }}" build-installer/NULL-JSFX-Installer-${{ matrix.name }}.* --clobber && exit 0; sleep $((i * 30)); done; exit 1

  validate:
    # The official validators on every built plugin: pluginval on each VST3 and clap-validator on
    # each CLAP, on Windows and Linux. A failure fails the run (required since 2026-11-01, when
    # every plugin passed both on both OS); failures also show in the job summary, and the
    # reports are uploaded as artifacts.
    name: validate (${{ matrix.name }})
    needs: build
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04: pluginval 2 needs glibc 2.38; the plugins built on 22.04 load there too
          - { os: ubuntu-24.04, name: Linux, exe: "", python: python3,
              pluginval_sha256: 2e23d311c8c2664457b11be8f6cf4ed29cfdc08765c71c43934a1ed3360f118f }
          - { os: windows-2022, name: Windows, exe: ".exe", python: python,
              pluginval_sha256: da158e918b60430c6a5223cd99cc2e746bda604e583258c400898caf4e95c523 }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # pluginval (Tracktion, GPLv3): only run here, never linked or shipped. Pinned to a release
      # tag and checked by SHA-256. There is no v2.0.0 tag yet; v2.0.0-beta3 reports 2.0.0.
      PLUGINVAL_TAG: v2.0.0-beta3
      # clap-validator (free-audio, MIT): no release binaries, built from this commit
      CLAP_VALIDATOR_REV: b2f1d9b79b1d264a5747f46707d72b1aa40a02ef
      PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: NULL-JSFX-VST3-CLAP-${{ matrix.name }}
          path: pkg

      - name: Linux libraries (pluginval, plugins)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2t64 libfreetype6 libfontconfig1 \
            libgl1 libx11-6 libxcursor1 libxext6 libxrandr2 libdbus-1-3

      - name: pluginval
        if: ${{ !cancelled() }}
        run: |
          curl -sSfL -o pluginval.zip \
            "https://github.com/Tracktion/pluginval/releases/download/$PLUGINVAL_TAG/pluginval_${{ matrix.name }}.zip"
          echo "${{ matrix.pluginval_sha256 }}  pluginval.zip" | sha256sum -c -
          mkdir -p validators
          ${{ matrix.python }} -m zipfile -e pluginval.zip validators/
          chmod +x validators/pluginval${{ matrix.exe }}
          validators/pluginval${{ matrix.exe }} --version
          echo "PLUGINVAL=$PWD/validators/pluginval${{ matrix.exe }}" >> "$GITHUB_ENV"

      - uses: actions/cache@v6
        if: ${{ !cancelled() }}
        with:
          path: clap-validator
          key: clap-validator-${{ runner.os }}-${{ env.CLAP_VALIDATOR_REV }}

      - name: clap-validator
        if: ${{ !cancelled() }}
        run: |
          if [ ! -x "clap-validator/bin/clap-validator${{ matrix.exe }}" ]; then
            cargo install --git https://github.com/free-audio/clap-validator \
              --rev "$CLAP_VALIDATOR_REV" --locked --root clap-validator
          fi
          echo "CLAP_VALIDATOR=$PWD/clap-validator/bin/clap-validator${{ matrix.exe }}" >> "$GITHUB_ENV"

      - name: Validate the VST3 plugins (pluginval)
        if: ${{ !cancelled() }}
        run: native/scripts/validate.sh pluginval pkg reports

      - name: Validate the CLAP plugins (clap-validator)
        if: ${{ !cancelled() }}
        run: native/scripts/validate.sh clap pkg reports

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: NULL-JSFX-Validation-${{ matrix.name }}
          path: reports
          retention-days: 14
