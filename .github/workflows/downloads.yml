name: Count downloads

# Counts the downloads of every release package for the "X downloads" line under the
# site's Download button, without analytics: it sums the public download_count GitHub keeps for
# each release asset. tools/count_downloads.py keeps a ledger by asset id that never lowers a
# count, so the total does not drop when a release is deleted; the site shows the exact total.
# downloads.json is committed to main only when the total changes or a new asset appears (at most
# once a run, so about once a day); assets/js/downloads.js reads it. It also copies the Android
# apps' counts per channel from the Koulaxizis Apps download counter (APPS-DL) into "android", so
# the site itself still asks no other server.

on:
  schedule:
    - cron: "0 3 * * *"
  # a release is built as a draft (release.yml) and counted once it is published
  release:
    types: [published]
  workflow_run:
    workflows: ["VST3 and CLAP"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: count-downloads
  cancel-in-progress: false

jobs:
  count:
    # after "VST3 and CLAP" only when a manual run attached packages to a release: PR and main
    # runs add no assets
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.event == 'workflow_dispatch'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main

      - name: Count and push downloads.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="$(python3 tools/count_downloads.py downloads.json --tags '^[0-9]' \
            --android https://apps.koulaxizis.workers.dev/stats.json \
            --android-pkgs 'tech.nulljsfx.,online.useoros.,gr.koulaxizis.apps,tech.noxpress.,net.glarolykoi.')"
          echo "downloads.json: $result"
          if [ "$result" != changed ]; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add downloads.json
          git commit -m 'Update downloads.json'
          for i in 1 2 3 4; do
            if git push origin HEAD:main; then exit 0; fi
            sleep $((i * 4))
            git pull --rebase origin main
          done
          echo "::error::Could not push downloads.json"
          exit 1
