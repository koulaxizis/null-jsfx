name: Web version

# Checks web/ (the JavaScript version of NULL JSFX for browsers): the translated effects in
# web/fx match DATA/, the runtime tests pass, and every effect sounds the same as its JSFX in
# ysfx (null test, largest difference below -120 dB). See web/README.md.

on:
  push:
    branches: [main]
    paths: ["web/**", "DATA/**", ".github/workflows/web.yml"]
  pull_request:
    paths: ["web/**", "DATA/**", ".github/workflows/web.yml"]
  workflow_dispatch:

# Pull requests run on every push to their branch; a newer push cancels the older run of the same
# PR. Pushes run only on main, so a branch with a PR is not built twice. Runs on main, releases
# and manual runs each get their own group, so they are never cancelled or queued (release
# uploads always finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: tests/.build/ysfx
          key: ysfx-${{ hashFiles('tests/run.sh') }}
      - run: sudo apt-get install -y nasm
      - run: web/test/run.sh
