name: Test plugins

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Pull requests run on every push to their branch; a newer push cancels the older run of the same
# PR. Pushes run only on main, so a branch with a PR is not built twice. Runs on main, releases
# and manual runs each get their own group, so they are never cancelled or queued (release
# uploads always finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only: these jobs only build and test.
permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/cache@v6
        with:
          path: tests/.build/ysfx
          key: ysfx-${{ hashFiles('tests/run.sh') }}
      - run: sudo apt-get install -y nasm
      - run: tests/run.sh
      # odd and very low sample rates (8 kHz phone audio, 22.05 kHz, and two odd rates of
      # clap-validator): every filter must stay below Nyquist; the plain JSFX share their audio
      # code with the GFX versions, so they are enough here
      - run: NULL_TEST_RATES=8000,22050,1234.57,12345.68 tests/run.sh DATA/Effects/null_jsfx/*.jsfx
      - run: python3 tools/build_site.py --check
      - run: python3 tools/build_chains.py --check
      - run: python3 tools/build_presets.py --check
      - run: python3 tools/build_assisted.py --check
      - run: python3 tools/build_bible.py --check
      # the Bible's changelog (Part X) stays oldest first, newest at the bottom (R26)
      - run: python3 tests/bible_order.py

  remote:
    # the tablet remote (remote/): page in a real browser + bridge script under a REAPER stand-in
    timeout-minutes: 20
    # Playwright 1.64 has a Chromium for ubuntu-latest (26.04); 1.56 had none, so until
    # 2026-11-01 this job was pinned to 24.04
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: python3 tools/build_remote.py --check
      - run: npm ci
        working-directory: tests/remote
      - run: npx playwright install --with-deps chromium
        working-directory: tests/remote
      - run: node tests/remote/remote_test.cjs

  mixers:
    # the Mixers tab of NULL Remote (android/web/mixers/): OSC codec, laws, the X AIR profile and a
    # live session against the X AIR simulator over UDP, then the tab in a real browser
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: tests/mixers
      - run: npx playwright install --with-deps chromium
        working-directory: tests/mixers
      - run: node tests/mixers/mixers_test.cjs
      - run: node tests/mixers/ui_test.cjs

  media:
    # presentation videos, posters and screenshots older than their plugin's interface
    # (tools/media_check.py): report only, as warnings on the run
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - run: python3 tools/media_check.py
