name: Android remotes

# The NULL JSFX Android remotes (android/): one shell, two apps (Remote for DAWs, and Remote
# for Mixers), each as "github" (our releases, with an update notice) and "fdroid".
#   pages   the apps' pages (android/web) in Chromium against the REAPER stand-in
#   build   unit tests, Android lint, and every APK (debug) as a workflow artifact
#   mixers-device  Remote for Mixers (debug APK) in an Android emulator against the X AIR
#           simulator on the host: the Kotlin UDP bridge and the WebView end to end
#   release with a release tag (the Release workflow, which builds a draft release, or by hand
#           for a release that exists): the signed release APKs of the apps in RELEASED_APPS,
#           attached to it; or by hand with sign_check: the same APKs, signature checked, kept
#           as a workflow artifact only (to test the secrets without a release)
# Signing uses the orOS keystore (Christos, 2026-11-01) from the repository secrets
# ANDROID_KEYSTORE (base64 of the .jks), ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and
# ANDROID_KEY_PASSWORD. Without them a release gets no APK and the run says so.

on:
  push:
    branches: [main]
    paths: ["android/**", "remote/**", "native/common/fonts/**", "web/runtime/**", "web/fx/**", "tests/remote/**", "tests/mixers/**", "tests/lint.py", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "remote/**", "native/common/fonts/**", "web/runtime/**", "web/fx/**", "tests/remote/**", "tests/mixers/**", "tests/lint.py", ".github/workflows/android.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the APKs to this existing release (e.g. 3.1); empty = only build"
        required: false
        default: ""
      sign_check:
        description: "Build the signed release APKs, check their signature and keep them as a workflow artifact (no release)"
        type: boolean
        required: false
        default: false
  # from release.yml, which creates the draft release first; a draft has no tag yet, so it
  # passes the commit to build
  workflow_call:
    inputs:
      release_tag:
        type: string
        required: true
      checkout_ref:
        type: string
        required: false
        default: ""

# A fixed group name, as in native.yml: github.workflow is the caller's name in a called workflow.
concurrency:
  group: android-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  TAG: ${{ inputs.release_tag }}
  # the apps attached to a release (Remote for Mixers since its X AIR version, 2026-11-01)
  RELEASED_APPS: "daws mixers"

jobs:
  pages:
    timeout-minutes: 15
    # Playwright 1.64 (tests/remote) has a Chromium for ubuntu-latest, as in test.yml's job remote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: tests/remote
      - run: npx playwright install --with-deps chromium
        working-directory: tests/remote
      - run: node tests/remote/android_test.cjs

  build:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - name: Unit tests, lint and the debug APKs
        working-directory: android
        run: ./gradlew --no-daemon testDawsGithubDebugUnitTest lintDawsGithubDebug lintMixersGithubDebug assembleDebug
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: NULL-JSFX-Android-debug
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/reports/
          retention-days: 14

  mixers-device:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci
        working-directory: tests/mixers
      - name: Debug APK of Remote for Mixers
        working-directory: android
        run: ./gradlew --no-daemon assembleMixersGithubDebug
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: The app in an emulator against the X AIR simulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node tests/mixers/device_test.cjs android/app/build/outputs/apk/mixersGithub/debug/app-mixers-github-debug.apk device-shots
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: Remote-for-Mixers-emulator
          path: device-shots/
          retention-days: 14

  release:
    if: inputs.release_tag != '' || inputs.sign_check
    needs: [pages, build]
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.checkout_ref || env.TAG }}
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
      # Says which secret is wrong without printing any of them (they are masked anyway). It reads
      # them exactly as android/app/build.gradle.kts does: java.util.Base64 on the trimmed
      # keystore, KeyStore.getInstance(file, store password), getKey(alias, key password).
      - name: Check the signing secrets
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE }}
          SP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
          KP: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          [ -n "$KS" ] || { echo "no ANDROID_KEYSTORE (checked in the next step)"; exit 0; }
          bad=0
          for v in SP KA KP; do
            [ -n "${!v}" ] || { echo "::error::secret for $v is empty"; bad=1; }
            [ "${!v}" = "$(printf '%s' "${!v}" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')" ] \
              || { echo "::error::secret for $v starts or ends with a space or a line break"; bad=1; }
          done
          [ "$bad" = 0 ] || exit 1
          trap 'rm -f "$RUNNER_TEMP/KeyCheck.java" "$RUNNER_TEMP/check.keystore"' EXIT
          cat > "$RUNNER_TEMP/KeyCheck.java" <<'JAVA'
          import java.io.File;
          import java.nio.file.Files;
          import java.security.KeyStore;
          import java.util.Base64;
          public class KeyCheck {
            static void fail(String m) { System.out.println("::error::" + m); System.exit(1); }
            public static void main(String[] a) throws Exception {
              String ks64 = System.getenv("KS").trim(), sp = System.getenv("SP"), ka = System.getenv("KA"), kp = System.getenv("KP");
              byte[] raw;
              try { raw = Base64.getDecoder().decode(ks64); }
              catch (IllegalArgumentException e) {
                fail("ANDROID_KEYSTORE is not one line of base64 (" + e.getMessage() + "); make it with: base64 -w0 your.jks");
                return;
              }
              String kind = raw.length > 4 && (raw[0] & 0xff) == 0xFE && (raw[1] & 0xff) == 0xED ? "JKS"
                          : raw.length > 1 && raw[0] == 0x30 ? "PKCS12" : "unknown";
              System.out.println("keystore: " + raw.length + " bytes, looks like " + kind);
              if (kind.equals("unknown")) fail("ANDROID_KEYSTORE does not decode to a .jks or .p12 file (was the file encoded twice, or is it another file?)");
              File f = new File(a[0]);
              Files.write(f.toPath(), raw);
              KeyStore ks;
              try { ks = KeyStore.getInstance(f, sp.toCharArray()); }
              catch (Exception e) { fail("ANDROID_KEYSTORE_PASSWORD does not open the keystore (" + e.getClass().getSimpleName() + ")"); return; }
              finally { f.delete(); }
              int keys = 0;
              for (String al : java.util.Collections.list(ks.aliases())) if (ks.isKeyEntry(al)) keys++;
              System.out.println("store password: ok; type " + ks.getType() + ", " + keys + " private key(s)");
              if (!ks.containsAlias(ka)) fail("ANDROID_KEY_ALIAS is not in the keystore");
              System.out.println("alias: found");
              try {
                if (ks.getKey(ka, kp.toCharArray()) == null) fail("ANDROID_KEY_ALIAS names a certificate, not a private key");
                System.out.println("key password: ok");
              } catch (java.security.UnrecoverableKeyException e) {
                boolean same = false;
                try { same = ks.getKey(ka, sp.toCharArray()) != null; } catch (Exception e2) {}
                fail(same ? "ANDROID_KEY_PASSWORD is wrong; the keystore password opens the key, so set ANDROID_KEY_PASSWORD to the same value as ANDROID_KEYSTORE_PASSWORD"
                          : "ANDROID_KEY_PASSWORD does not open the key");
              }
            }
          }
          JAVA
          java "$RUNNER_TEMP/KeyCheck.java" "$RUNNER_TEMP/check.keystore"
      - name: Signed release APKs
        id: apks
        working-directory: android
        env:
          NULL_REMOTE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          NULL_REMOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NULL_REMOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NULL_REMOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$NULL_REMOTE_KEYSTORE" ]; then
            if [ -z "$TAG" ]; then echo "::error::No ANDROID_KEYSTORE secret"; exit 1; fi
            echo "::warning::No ANDROID_KEYSTORE secret: release $TAG gets no Android APKs"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p out
          for app in $RELEASED_APPS; do
            A="$(tr '[:lower:]' '[:upper:]' <<< "${app:0:1}")${app:1}"
            ./gradlew --no-daemon "assemble${A}GithubRelease"
            apk="app/build/outputs/apk/${app}Github/release/app-${app}-github-release.apk"
            [ -f "$apk" ] || { echo "no $apk"; exit 1; }
            name="$([ "$app" = daws ] && echo DAWs || echo "$A")"
            cp "$apk" "out/NULL-JSFX-Remote-${name}-Android.apk"
          done
          ls -l out
      # The certificate digests are public (they are in every APK); they let anyone check that
      # an APK is ours and that the orOS key signed it.
      - name: Check the signatures
        if: steps.apks.outputs.skip != '1'
        working-directory: android
        run: |
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in out/*.apk; do
            echo "== $apk"
            "$bt/apksigner" verify --verbose --print-certs "$apk" | grep -E "Verified using|Signer #1 certificate (DN|SHA-256)"
            if "$bt/apksigner" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is debug-signed"; exit 1
            fi
          done
      - name: Keep the APKs (sign check)
        if: steps.apks.outputs.skip != '1' && env.TAG == ''
        uses: actions/upload-artifact@v7
        with:
          name: NULL-JSFX-Android-signed
          path: android/out/
          retention-days: 7
      - name: Attach to the release
        if: steps.apks.outputs.skip != '1' && env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: for i in 1 2 3 4 5; do gh release upload "$TAG" android/out/* --clobber && exit 0; sleep $((i * 30)); done; exit 1
