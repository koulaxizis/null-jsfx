name: F-Droid repository

# Our own F-Droid repository for the Android remotes (Bible II.10), so F-Droid, Droid-ify and
# Obtainium install and update Remote for DAWs and Remote for Mixers:
#   https://koulaxizis.github.io/null-jsfx-fdroid/repo
# On every published release it builds the "fdroid" flavor (no update notice of our own) of
# each app in tools/fdroid_repo.py APPS from the release tag, signed with the same key as the
# APKs on the release, so a phone can switch between the two without reinstalling. The index is
# signed with that same key (Christos, 2026-11-02: one key, no second keystore to keep). Store texts come from the apps'
# fastlane folders. Published as one force-pushed commit on koulaxizis/null-jsfx-fdroid
# (GitHub Pages), keeping the newest 3 versions of each app.
#
# Secrets (Settings > Secrets and variables > Actions):
#   ANDROID_KEYSTORE, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#                            the APK key, as in android.yml; it also signs the repository index
#   FDROID_DEPLOY_TOKEN      fine-grained token: koulaxizis/null-jsfx-fdroid, Contents read/write
# Without them the run says so and publishes nothing. A new key means every phone has to add the
# repository again (and reinstall the apps).

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish the apps of this release (e.g. 3.1); empty = the latest release"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: fdroid-repo
  cancel-in-progress: false

jobs:
  publish:
    timeout-minutes: 30
    runs-on: ubuntu-24.04
    env:
      SITE: https://koulaxizis.github.io/null-jsfx-fdroid
      DEST: koulaxizis/null-jsfx-fdroid
    steps:
      - name: Secrets and release tag
        id: pre
        env:
          GH_TOKEN: ${{ github.token }}
          HAS: ${{ secrets.ANDROID_KEYSTORE != '' && secrets.FDROID_DEPLOY_TOKEN != '' }}
          TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: |
          if [ "$HAS" != "true" ]; then
            echo "::notice::No ANDROID_KEYSTORE or FDROID_DEPLOY_TOKEN secret: nothing published."
            echo "go=0" >> "$GITHUB_OUTPUT"; exit 0
          fi
          [ -n "$TAG" ] || TAG=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "go=1" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        if: steps.pre.outputs.go == '1'
        with:
          ref: ${{ steps.pre.outputs.tag }}
      - uses: actions/setup-java@v5
        if: steps.pre.outputs.go == '1'
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v5
        if: steps.pre.outputs.go == '1'
      - uses: actions/setup-python@v6
        if: steps.pre.outputs.go == '1'
        with:
          python-version: "3.12"

      - name: Signed fdroid-flavor APKs
        if: steps.pre.outputs.go == '1'
        working-directory: android
        env:
          NULL_REMOTE_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          NULL_REMOTE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NULL_REMOTE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NULL_REMOTE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          apps=$(python3 -c 'import sys; sys.path.insert(0, "../tools"); import fdroid_repo; print(" ".join(fdroid_repo.APPS))')
          for app in $apps; do
            A="$(tr '[:lower:]' '[:upper:]' <<< "${app:0:1}")${app:1}"
            ./gradlew --no-daemon "assemble${A}FdroidRelease"
          done
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in app/build/outputs/apk/*Fdroid/release/*.apk; do
            "$bt/apksigner" verify --print-certs "$apk" | grep -E "certificate (DN|SHA-256)"
            if "$bt/apksigner" verify --print-certs "$apk" | grep -q "CN=Android Debug"; then
              echo "::error::$apk is debug-signed"; exit 1
            fi
          done

      - name: Build the repository
        if: steps.pre.outputs.go == '1'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e
          pip install --quiet fdroidserver==2.4.5
          fd="$RUNNER_TEMP/fd"
          mkdir -p "$fd/repo"
          python3 tools/fdroid_repo.py meta "$fd"
          cp android/fdroid/icon.png "$fd/icon.png"
          # The earlier versions stay downloadable (a phone may hold an older index)
          prev="$RUNNER_TEMP/prev"
          if git clone -q --depth 1 "https://github.com/$DEST.git" "$prev" 2>/dev/null && [ -d "$prev/repo" ]; then
            cp "$prev"/repo/*.apk "$fd/repo/" 2>/dev/null || true
          else
            echo "::notice::No earlier publish found: a new repository."
          fi
          bt="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          for apk in android/app/build/outputs/apk/*Fdroid/release/*.apk; do
            badge=$("$bt/aapt2" dump badging "$apk" | head -1)
            pkg=$(echo "$badge" | sed -n "s/^package: name='\([^']*\)'.*/\1/p")
            code=$(echo "$badge" | sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p")
            name=$(python3 tools/fdroid_repo.py name "$apk" "$pkg" "$code")
            # the same versionCode built again replaces the earlier build of it
            rm -f "$fd/repo/${pkg}_${code}_"*.apk
            cp "$apk" "$fd/repo/$name"
            echo "$name"
          done
          python3 tools/fdroid_repo.py prune "$fd/repo" 3
          umask 077
          echo "$KS_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/repo.keystore"
          cat > "$fd/config.yml" <<EOF
          repo_url: $SITE/repo
          repo_name: NULL JSFX
          repo_description: "The NULL JSFX Android remotes: Remote for DAWs and Remote for Mixers. Free and open source (MIT), free forever. https://nulljsfx.tech"
          repo_icon: icon.png
          archive_older: 0
          keystore: $RUNNER_TEMP/repo.keystore
          keystorepass: "$KS_PASS"
          keypass: "$KEY_PASS"
          repo_keyalias: "$KEY_ALIAS"
          keydname: CN=NULL JSFX F-Droid repo, O=NULL JSFX
          apksigner: $bt/apksigner
          EOF
          (cd "$fd" && fdroid update --pretty)
          rm -f "$RUNNER_TEMP/repo.keystore" "$fd/config.yml"
          python3 - "$fd/repo/index-v2.json" <<'PY'
          import json, sys
          idx = json.load(open(sys.argv[1]))
          for pkg, p in idx["packages"].items():
              print(pkg, sorted(v["manifest"]["versionCode"] for v in p["versions"].values()))
          PY

      - name: Publish to koulaxizis/null-jsfx-fdroid
        if: steps.pre.outputs.go == '1'
        env:
          TOKEN: ${{ secrets.FDROID_DEPLOY_TOKEN }}
          TAG: ${{ steps.pre.outputs.tag }}
        run: |
          set -e
          site="$RUNNER_TEMP/site"
          mkdir -p "$site"
          cp -r "$RUNNER_TEMP/fd/repo" "$site/repo"
          touch "$site/.nojekyll"
          cat > "$site/README.md" <<EOF
          # NULL JSFX F-Droid repository

          The NULL JSFX Android remotes (Remote for DAWs, Remote for Mixers), kept up to date by
          F-Droid, Droid-ify or Obtainium. Add this repository: $SITE/repo

          Built by [koulaxizis/null-jsfx](https://github.com/koulaxizis/null-jsfx)
          (.github/workflows/fdroid-repo.yml) from release $TAG; do not edit by hand.
          EOF
          cd "$site"
          git init -q -b main
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "NULL JSFX F-Droid repository from release $TAG"
          # one commit, replaced each time: the APKs never pile up in history
          git push -q --force "https://x-access-token:$TOKEN@github.com/$DEST.git" main
          echo "Published $(ls repo/*.apk | wc -l) APKs to $SITE/repo"
