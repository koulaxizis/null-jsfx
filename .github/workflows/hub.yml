name: NULL JSFX Hub

# NULL JSFX Hub (hub/): the app that installs, updates and removes the plugins.
#   core      its engine (hub/core) tested on Windows, macOS and Linux
#   ui        its page (hub/ui) in a browser against a stand-in, and the catalog check
#   smoke     install and remove from the latest real release, fetching only the parts needed
#             (skipped when a release is published, before its packages are attached)
#   build     the app for Windows (setup .exe), Linux (.AppImage, .deb) and macOS (.dmg)
# When a GitHub release is published, the app and NULL-JSFX-Catalog.json (what the Hub reads to
# know the release: tools/build_catalog.py) are attached to it. Run by hand with a release tag
# to attach them to a release that already exists.

on:
  push:
    branches: [main]
    paths: ["hub/**", "tools/build_catalog.py", "tools/build_site.py", "tools/site_content.json", "tools/site_chains.json", "tools/presets/**", "DATA/**", ".github/workflows/hub.yml"]
  pull_request:
    paths: ["hub/**", "tools/build_catalog.py", "tools/build_site.py", "tools/site_content.json", "tools/site_chains.json", "tools/presets/**", "DATA/**", ".github/workflows/hub.yml"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the Hub and the catalog to this existing release (e.g. 2.2); empty = only build"
        required: false
        default: ""
  release:
    types: [published]

# Pull requests run on every push to their branch; a newer push cancels the older run of the same
# PR. Pushes run only on main, so a branch with a PR is not built twice. Runs on main, releases
# and manual runs each get their own group, so they are never cancelled or queued (release
# uploads always finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Read-only by default; only the jobs that attach to a release may write.
permissions:
  contents: read

env:
  TAG: ${{ github.event.release.tag_name || inputs.release_tag }}

jobs:
  # Whether the Hub itself changed. Plugin and site changes (DATA/, tools/...) only touch the
  # catalog, which ui and smoke check; the engine tests and the app builds on 3 OS run when hub/
  # or this workflow changes, and always on main pushes of those, releases and manual runs.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      hub: ${{ steps.diff.outputs.hub }}
    steps:
      - id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request)
              files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')" ;;
            push)
              # the compare API lists at most 300 files: past that, build everything
              files="$(gh api "repos/$GITHUB_REPOSITORY/compare/$BEFORE...$AFTER" --jq 'if (.files | length) >= 300 then "hub/" else .files[].filename end' || echo hub/)" ;;
            *) files="hub/" ;;
          esac
          if grep -qE '^(hub/|\.github/workflows/hub\.yml$)' <<<"$files"; then hub=true; else hub=false; fi
          echo "hub=$hub" | tee -a "$GITHUB_OUTPUT"

  core:
    needs: changes
    if: needs.changes.outputs.hub == 'true'
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: hub
      - run: cargo test -p null_hub_core
        working-directory: hub

  ui:
    timeout-minutes: 20
    # Playwright 1.56 has no Chromium for ubuntu-latest (26.04), so this job stays on 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tools/build_catalog.py --check
      - run: npm ci
        working-directory: hub
      - run: npx playwright install --with-deps chromium
        working-directory: hub
      - run: node tests/ui_test.cjs shots
        working-directory: hub
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-screenshots
          path: hub/shots

  smoke:
    # not on a release: its packages are still being attached (native.yml) when this starts
    if: github.event_name != 'release'
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: hub
      - run: hub/tests/release_smoke.sh

  build:
    needs: [core, ui]
    permissions:
      contents: write
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-2022, name: Windows, args: "--bundles nsis" }
          - { os: ubuntu-22.04, name: Linux, args: "--bundles appimage,deb" }
          - { os: macos-15, name: macOS, args: "--bundles dmg --target universal-apple-darwin" }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: hub

      - name: Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev patchelf file

      - name: Build
        working-directory: hub
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          npm ci
          npx tauri build ${{ matrix.args }} --ci

      - name: Collect
        run: |
          mkdir -p out
          b=hub/target/release/bundle
          [ -d hub/target/universal-apple-darwin ] && b=hub/target/universal-apple-darwin/release/bundle
          case "${{ matrix.name }}" in
            Windows) cp "$b"/nsis/*-setup.exe out/NULL-JSFX-Hub-Windows-Setup.exe ;;
            Linux)   cp "$b"/appimage/*.AppImage out/NULL-JSFX-Hub-Linux.AppImage
                     cp "$b"/deb/*.deb out/NULL-JSFX-Hub-Linux.deb ;;
            macOS)   cp "$b"/dmg/*.dmg out/NULL-JSFX-Hub-macOS.dmg ;;
          esac
          ls -la out

      - name: Starts and quits (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb
          chmod +x out/NULL-JSFX-Hub-Linux.AppImage
          export APPIMAGE_EXTRACT_AND_RUN=1 NULL_JSFX_HUB_DATA="$RUNNER_TEMP/hubdata"
          xvfb-run -a out/NULL-JSFX-Hub-Linux.AppImage & pid=$!
          sleep 15
          kill -0 $pid || { echo "the Hub quit on its own"; exit 1; }
          kill $pid || true

      - name: The released Hub (Windows)
        # from the newest release other than $TAG that has one: when a release is published,
        # "latest" is that release, and its Hub is the one being built here
        if: runner.os == 'Windows'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          from="$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select((.prerelease | not) and .tag_name != env.TAG and any(.assets[]; .name == "NULL-JSFX-Hub-Windows-Setup.exe"))][0].tag_name // empty')"
          [ -n "$from" ] || { echo "no earlier release has a Windows Hub"; exit 1; }
          echo "updating from the Hub of release $from"
          gh release download "$from" --repo "$GITHUB_REPOSITORY" --pattern NULL-JSFX-Hub-Windows-Setup.exe --output "$RUNNER_TEMP/released.exe"

      - name: Updates itself (Windows)
        # what "Update the Hub" does (hub/app/src/selfupdate.rs): the released Hub is running, the
        # new setup runs with /P /R; the new Hub must be installed and running afterwards
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Start-Process "$env:RUNNER_TEMP\released.exe" -ArgumentList '/S' -Wait
          $exe = "$env:LOCALAPPDATA\NULL JSFX Hub\null-jsfx-hub.exe"
          $env:NULL_JSFX_HUB_DATA = "$env:RUNNER_TEMP\hubdata"
          Start-Process $exe
          Start-Sleep 10
          if (-not (Get-Process null-jsfx-hub -ErrorAction SilentlyContinue)) { throw "the released Hub did not start" }
          Start-Process out\NULL-JSFX-Hub-Windows-Setup.exe -ArgumentList '/P', '/R'
          $want = (Get-Item out\NULL-JSFX-Hub-Windows-Setup.exe).VersionInfo.ProductVersion
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep 2
            $p = Get-Process null-jsfx-hub -ErrorAction SilentlyContinue
            if ($p -and (Get-Item $exe).VersionInfo.ProductVersion -eq $want -and -not (Get-Process | Where-Object Path -like "*NULL-JSFX-Hub-Windows-Setup.exe")) { break }
          }
          $got = (Get-Item $exe).VersionInfo.ProductVersion
          "installed $got, want $want"
          if ($got -ne $want) { throw "the setup did not update the Hub" }
          if (-not (Get-Process null-jsfx-hub -ErrorAction SilentlyContinue)) { throw "the new Hub did not start" }
          Stop-Process -Name null-jsfx-hub -Force

      - uses: actions/upload-artifact@v4
        with:
          name: NULL-JSFX-Hub-${{ matrix.name }}
          path: out/*

      - name: Attach to the release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        # retried: the upload endpoint can answer HTTP 500 for a while (2.6 release)
        run: for i in 1 2 3 4 5; do gh release upload "$TAG" out/* --clobber && exit 0; sleep $((i * 30)); done; exit 1

  catalog:
    if: github.event_name == 'release' || inputs.release_tag != ''
    permissions:
      contents: write
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and attach NULL-JSFX-Catalog.json
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ github.event.release.body }}
        run: |
          if [ -z "$NOTES" ]; then NOTES="$(gh release view "$TAG" --json body --jq .body)"; fi
          printf '%s\n' "$NOTES" > notes.md
          date="$(gh release view "$TAG" --json publishedAt --jq '.publishedAt[:10]')"
          python3 tools/build_catalog.py --version "$TAG" --notes notes.md --date "$date" --out NULL-JSFX-Catalog.json
          for i in 1 2 3 4 5; do gh release upload "$TAG" NULL-JSFX-Catalog.json --clobber && exit 0; sleep $((i * 30)); done; exit 1
