<!DOCTYPE html>
<!-- Test harness for the Mixers tab: a stand-in for the app's tab shell and native UDP bridge.
     ui_test.cjs serves it and wires window.NullShell to real UDP in Node. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NULL Remote Mixers harness</title>
<style>html, body { margin: 0; height: 100%; background: #1b1a18; } #tab { height: 100vh; }</style>
<script>
  // NullShell stand-in: the Node side exposes nmUdpSend/nmUdpBroadcast and calls __nmDeliver
  const udpListeners = [];
  window.NullShell = {
    udpOpen: () => 1,
    udpSend: (id, host, port, b64) => window.nmUdpSend(host, port, b64),
    udpBroadcast: (id, port, b64) => window.nmUdpBroadcast(port, b64),
    udpClose: () => {},
    on: (type, cb) => { if (type === 'udp') udpListeners.push(cb); },
    off: (type, cb) => { const i = udpListeners.indexOf(cb); if (i >= 0) udpListeners.splice(i, 1); },
    haptic: () => {},
    keepAwake: (on) => { window.__awake = on; },
  };
  window.__nmDeliver = (m) => udpListeners.forEach((cb) => cb(m));
  window.NullRemote = { register: (tab) => { window.__tab = tab; } };
</script>
</head>
<body>
<div id="tab"></div>
<script src="/android/web/mixers/mixers.js"></script>
<script>window.__tab.mount(document.getElementById('tab'));</script>
</body>
</html>
