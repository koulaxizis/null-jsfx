<!DOCTYPE html>
<!-- Test harness for the Mixers tab: a stand-in for the app's tab shell and native UDP and TCP bridge.
     ui_test.cjs serves it and wires window.NullShell to real UDP in Node. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NULL Remote Mixers harness</title>
<style>html, body { margin: 0; height: 100%; background: #1b1a18; } #tab { height: 100vh; }</style>
<script>
  // NullShell stand-in: the Node side exposes nmUdpSend/nmUdpBroadcast and nmTcpOpen/nmTcpSend/
  // nmTcpClose, and calls __nmDeliver with {type: 'udp' | 'tcpopen' | 'tcp' | 'tcpclose', ...}
  const listeners = {};
  let tcpId = 0;
  window.NullShell = {
    udpOpen: () => 1,
    udpSend: (id, host, port, b64) => window.nmUdpSend(host, port, b64),
    udpBroadcast: (id, port, b64) => window.nmUdpBroadcast(port, b64),
    udpClose: () => {},
    tcpOpen: (host, port) => { const id = ++tcpId; window.nmTcpOpen(id, host, port); return id; },
    tcpSend: (id, b64) => { window.nmTcpSend(id, b64); return true; },
    tcpClose: (id) => { window.nmTcpClose(id); },
    on: (type, cb) => { (listeners[type] = listeners[type] || []).push(cb); },
    off: (type, cb) => { const l = listeners[type] || []; const i = l.indexOf(cb); if (i >= 0) l.splice(i, 1); },
    haptic: () => {},
    keepAwake: (on) => { window.__awake = on; },
  };
  window.__nmDeliver = (m) => (listeners[m.type] || []).slice().forEach((cb) => cb(m));
  window.NullRemote = { register: (tab) => { window.__tab = tab; } };
</script>
</head>
<body>
<div id="tab"></div>
<script src="/android/web/mixers/mixers.js"></script>
<script>window.__tab.mount(document.getElementById('tab'));</script>
</body>
</html>
