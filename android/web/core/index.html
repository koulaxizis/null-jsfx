<!doctype html>
<!-- The start page of the NULL JSFX Android remotes. Remote for DAWs shows the DAW tabs
     (android/web/daws: REAPER, then Ardour and Bitwig on the shared desk in daws/core), the
     mixer remote the Mixers tab (android/web/mixers); both have Settings.
     NULL JSFX • https://nulljsfx.tech • MIT License -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="color-scheme" content="dark">
<title>NULL JSFX Remote</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="banner" id="update" hidden>
  <span id="update-text"></span>
  <button id="update-get" class="primary">Download</button>
  <button id="update-later" aria-label="Later">✕</button>
</div>
<div id="views"></div>
<nav class="tabs" id="tabs"></nav>
<script src="shell.js"></script>
<script src="remote.js"></script>
<script src="../daws/reaper/reaper.js"></script>
<script src="../daws/core/desk.js"></script>
<script src="../daws/ardour/ardour-tab.js"></script>
<script src="../daws/bitwig/bitwig-tab.js"></script>
<script src="../mixers/mixers.js" onerror="this.remove()"></script>
<script src="settings.js"></script>
<script>NullRemote.start();</script>
</body>
</html>
