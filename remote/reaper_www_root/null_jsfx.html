<!DOCTYPE html>
<!--
  NULL JSFX Remote: REAPER's mixer and the NULL JSFX plugins on a tablet
  NULL JSFX v2.8 • https://nulljsfx.tech • MIT License

  Served by REAPER's web interface (Preferences > Control/OSC/web > Web browser interface).
  Tracks, volume, pan, mute, solo, arm, meters and transport go through the web interface
  itself; FX need the bridge script (Scripts/null_jsfx_remote_bridge.lua) running in REAPER.
  See remote/INSTALL.txt. The plugin list is generated by tools/build_remote.py.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#131211">
<title>NULL JSFX Remote</title>
<style>
:root {
  --bg: #1b1a18; --bg2: #131211; --card: #232220; --border: #333333; --border-hi: #45433f;
  --active: #2d2b28; --text: #e0e0e0; --muted: #999999; --slogan: #6a6a6a; --accent: #c4c4c4;
  --logo-bg: #2d2d2d; --logo-edge: #4a4a4a; --warn: #d9a441; --clip: #d4534a;
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
body {
  font: 14px/1.3 "Noto Sans", "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
  display: flex; flex-direction: column; height: 100dvh;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button {
  font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--border);
  border-radius: 8px; padding: 0 12px; height: 40px; min-width: 40px; cursor: pointer; touch-action: manipulation;
}
button:active, button.on { background: var(--active); border-color: var(--border-hi); }
button:disabled { opacity: .4; }
svg { display: block; }

/* header: logo, plugin/page name and slogan, as in the GFX versions */
.top {
  display: flex; align-items: center; gap: 16px; padding: 8px 16px; background: var(--bg2);
  border-bottom: 1px solid var(--border); flex: none; min-height: 60px;
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand .name { font-weight: 700; letter-spacing: 2px; white-space: nowrap; }
.brand .name span { color: var(--muted); font-weight: 400; letter-spacing: 1px; margin-left: 6px; }
.slogan { color: var(--slogan); font-size: 10px; letter-spacing: 2.5px; white-space: nowrap; }
.transport { display: flex; gap: 6px; margin-left: auto; align-items: center; }
.transport button { width: 46px; padding: 0; }
.transport button.rec.on { border-color: var(--clip); }
.transport button.rec.on svg { fill: var(--clip); }
.transport svg { width: 18px; height: 18px; margin: auto; fill: var(--text); }
.clock { font-variant-numeric: tabular-nums; min-width: 92px; text-align: right; font-size: 18px; color: var(--accent); }
.status { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12px; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--clip); }
.dot.ok { background: var(--accent); }

/* mixer */
.mixer { flex: 1; display: flex; gap: 6px; padding: 10px; overflow-x: auto; overflow-y: hidden; touch-action: pan-x; }
.strip {
  flex: none; width: 92px; display: flex; flex-direction: column; gap: 6px; padding: 6px;
  background: var(--card); border: 1px solid var(--border); border-radius: 10px; position: relative;
}
.strip.master { background: #262522; border-color: var(--border-hi); margin-right: 8px; }
.strip.sel { border-color: var(--accent); }
.strip .color { height: 4px; border-radius: 2px; background: var(--border); }
.strip .tname {
  font-size: 12px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  height: 18px; line-height: 18px;
}
.strip .fxbtn { height: 34px; font-size: 12px; letter-spacing: 1px; }
.strip .fxbtn.has { border-color: var(--border-hi); color: var(--accent); }
.strip .msr { display: flex; gap: 4px; }
.strip .msr button { flex: 1; min-width: 0; height: 34px; padding: 0; font-size: 12px; font-weight: 700; }
.strip .msr .m.on { background: #3a3730; color: var(--warn); }
.strip .msr .s.on { background: #3a3730; color: var(--accent); border-color: var(--accent); }
.strip .msr .r.on { background: #3a2a28; color: var(--clip); }
.pan { height: 26px; position: relative; background: var(--bg2); border: 1px solid var(--border); border-radius: 6px; touch-action: none; }
.pan .fill { position: absolute; top: 3px; bottom: 3px; background: var(--accent); opacity: .75; border-radius: 2px; }
.pan .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-hi); }
.pan .lbl { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 11px; color: var(--muted); mix-blend-mode: difference; }
.fadwrap { flex: 1; display: flex; gap: 6px; min-height: 120px; }
.fader { flex: 1; position: relative; touch-action: none; }
.fader .track { position: absolute; left: 50%; width: 4px; margin-left: -2px; top: 12px; bottom: 12px; background: var(--bg2); border-radius: 2px; }
.fader .zero { position: absolute; left: 6px; right: 6px; height: 1px; background: var(--border-hi); }
.fader .cap {
  position: absolute; left: 4px; right: 4px; height: 24px; margin-top: -12px; border-radius: 5px;
  background: linear-gradient(#55524d, #3a3834); border: 1px solid #66625c;
}
.fader .cap::after { content: ""; position: absolute; left: 6px; right: 6px; top: 11px; height: 1px; background: var(--accent); }
.meter { width: 10px; position: relative; background: var(--bg2); border-radius: 3px; overflow: hidden; margin: 12px 0; }
.meter .lvl { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(to top, #8a8a8a 0%, var(--accent) 80%, var(--warn) 92%, var(--clip) 100%); background-size: 100% var(--h, 100px); background-position: bottom; }
.strip .db { text-align: center; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; height: 16px; }

/* FX view */
.fxview { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--bg); }
.fxview[hidden], .sheet[hidden], .banner[hidden] { display: none; }
.fxbar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-bottom: 1px solid var(--border); flex: none; }
.fxbar .title { font-weight: 700; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fxbar .title small { color: var(--muted); font-weight: 400; margin-left: 8px; }
.fxbody { flex: 1; display: flex; min-height: 0; }
.chain { width: 260px; flex: none; overflow-y: auto; padding: 10px; border-right: 1px solid var(--border); display: flex; flex-direction: column; gap: 6px; }
.fxitem {
  display: flex; align-items: center; gap: 8px; padding: 6px; border: 1px solid var(--border); border-radius: 8px;
  background: var(--card); cursor: pointer; min-height: 52px;
}
.fxitem.open { border-color: var(--accent); background: var(--active); }
.fxitem.off .nm { opacity: .45; }
.fxitem .nm { flex: 1; min-width: 0; }
.fxitem .nm b { display: block; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fxitem .nm small { color: var(--muted); font-size: 11px; }
.pwr { width: 36px; height: 36px; min-width: 36px; padding: 0; }
.pwr svg { width: 16px; height: 16px; margin: auto; stroke: var(--slogan); fill: none; stroke-width: 2.4; stroke-linecap: round; }
.pwr.on svg { stroke: var(--accent); }
.editor { flex: 1; overflow-y: auto; padding: 14px; min-width: 0; }
.empty { color: var(--muted); padding: 24px; text-align: center; line-height: 1.6; }
.empty code { color: var(--text); }

/* a NULL plugin: card with the GFX header */
.plug { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; max-width: 980px; margin: 0 auto; }
.plug .head { display: flex; align-items: center; gap: 10px; padding: 10px 14px; background: var(--bg2); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.plug .head .pname { font-weight: 700; font-size: 16px; letter-spacing: 1px; }
.plug .head .meta { color: var(--muted); font-size: 12px; }
.plug .head .tools { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
.plug .head .tools button { height: 36px; font-size: 13px; }
.plug .body { padding: 18px 14px; }
.knobs { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 14px 10px; }
.ctl { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.ctl .lbl { font-size: 12px; color: var(--muted); text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.ctl .val { font-size: 13px; font-variant-numeric: tabular-nums; color: var(--text); white-space: nowrap; }
.knob { width: 76px; height: 76px; touch-action: none; }
.knob .bgarc { stroke: var(--bg2); }
.knob .arc { stroke: var(--accent); }
.ctl.wide { grid-column: 1 / -1; align-items: stretch; }
.ctl.wide .lbl { text-align: left; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; }
.seg button { height: 34px; padding: 0 10px; font-size: 12px; }
.seg button.on { border-color: var(--accent); color: var(--accent); }
select { font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; height: 38px; padding: 0 8px; max-width: 100%; }
.hs { height: 54px; position: relative; background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; touch-action: none; }
.hs .fill { position: absolute; top: 6px; bottom: 6px; background: linear-gradient(90deg, #77756f, var(--accent)); border-radius: 6px; }
.hs .mid { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--border-hi); }
.hs .thumb { position: absolute; top: 2px; bottom: 2px; width: 6px; margin-left: -3px; border-radius: 3px; background: var(--text); }
.hs.small { height: 34px; }
.one .val { font-size: 28px; text-align: center; color: var(--accent); margin: 6px 0 12px; }
.one .lbl { font-size: 13px; text-align: center; }
.file { color: var(--muted); font-size: 12px; text-align: center; }
.params { margin-top: 18px; }
.params summary { color: var(--muted); cursor: pointer; padding: 6px 0; }
.prow { display: grid; grid-template-columns: minmax(90px, 1.2fr) 3fr minmax(70px, 1fr); gap: 10px; align-items: center; padding: 4px 0; }
.prow .lbl { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prow .val { font-size: 12px; text-align: right; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.filter { width: 100%; margin-bottom: 8px; }
input:focus, select:focus { outline: none; border-color: var(--accent); }
input[type=search] { font: inherit; color: var(--text); background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; height: 40px; padding: 0 12px; }

/* add a NULL plugin */
.sheet { position: fixed; inset: 0; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 5; }
.sheetbox { background: var(--bg); border: 1px solid var(--border-hi); border-radius: 14px; width: min(760px, 100%); max-height: 100%; display: flex; flex-direction: column; overflow: hidden; }
.sheethead { display: flex; gap: 8px; padding: 12px; border-bottom: 1px solid var(--border); flex-wrap: wrap; align-items: center; }
.sheethead input { flex: 1; min-width: 160px; }
.addlist { overflow-y: auto; padding: 4px 12px 12px; }
.addlist h4 { margin: 14px 0 6px; font-size: 11px; letter-spacing: 2px; color: var(--muted); font-weight: 600; }
.addgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.addgrid button { height: 44px; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.banner { background: #2a2620; color: var(--text); border-bottom: 1px solid var(--border-hi); padding: 8px 16px; font-size: 13px; flex: none; }
.banner b { color: var(--warn); font-weight: 600; }
.main { flex: 1; position: relative; display: flex; min-height: 0; }

@media (max-width: 760px) {
  .slogan, .status span:last-child, .clock { display: none; }
  .fxbody { flex-direction: column; }
  .chain { width: auto; max-height: 34%; border-right: 0; border-bottom: 1px solid var(--border); }
  .top { gap: 8px; padding: 8px; }
  .transport button { width: 40px; }
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <svg viewBox="0 0 80 80" width="38" height="38" aria-hidden="true">
      <defs><linearGradient id="ng" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#888"/><stop offset="1" stop-color="#aaa"/></linearGradient></defs>
      <rect x=".5" y=".5" width="79" height="79" rx="12" fill="#2d2d2d" stroke="#4a4a4a"/>
      <path d="M24 20v40l32-40v40" stroke="url(#ng)" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" fill="none"/>
    </svg>
    <div>
      <div class="name">NULL JSFX<span id="pagename">Remote</span></div>
      <div class="slogan">AUDIO WITHOUT NOISE</div>
    </div>
  </div>
  <div class="transport">
    <span class="clock" id="clock">0:00.000</span>
    <button id="t-start" aria-label="Go to start"><svg viewBox="0 0 24 24"><path d="M5 5h2.5v14H5zM19 5v14L8.5 12z"/></svg></button>
    <button id="t-play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 4.5v15L19.5 12z"/></svg></button>
    <button id="t-pause" aria-label="Pause"><svg viewBox="0 0 24 24"><path d="M6.5 5h4v14h-4zM13.5 5h4v14h-4z"/></svg></button>
    <button id="t-stop" aria-label="Stop"><svg viewBox="0 0 24 24"><path d="M6 6h12v12H6z"/></svg></button>
    <button id="t-rec" class="rec" aria-label="Record"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6.5"/></svg></button>
    <button id="t-loop" aria-label="Repeat"><svg viewBox="0 0 24 24"><path d="M7 7h9.5V4.5L21 8.5l-4.5 4V10H8v3.5H5V9a2 2 0 0 1 2-2zm10 10H7.5v2.5L3 15.5l4.5-4V14H16v-3.5h3V15a2 2 0 0 1-2 2z"/></svg></button>
  </div>
  <div class="status"><span class="dot" id="dot"></span><span id="conn">Connecting</span></div>
</header>
<div class="banner" id="banner" hidden>
  <b>FX bridge not running.</b> The mixer works; to see and change FX, run
  <i>null_jsfx_remote_bridge.lua</i> in REAPER (Actions &gt; Show action list &gt; New action &gt; Load ReaScript).
</div>
<div class="main">
  <main class="mixer" id="mixer"></main>
  <section class="fxview" id="fxview" hidden>
    <div class="fxbar">
      <button id="fx-back">‹ Mixer</button>
      <div class="title" id="fx-title"></div>
      <button id="fx-add" disabled>+ Add NULL plugin</button>
    </div>
    <div class="fxbody">
      <aside class="chain" id="chain"></aside>
      <div class="editor" id="editor"></div>
    </div>
  </section>
</div>
<div class="sheet" id="addsheet" hidden>
  <div class="sheetbox">
    <div class="sheethead">
      <input type="search" id="add-search" placeholder="Search NULL JSFX plugins" autocomplete="off">
      <div class="seg" id="add-format"></div>
      <button id="add-close" aria-label="Close">✕</button>
    </div>
    <div class="addlist" id="addlist"></div>
  </div>
</div>

// Setup

const SEC = 'NULL_JSFX_REMOTE';
const query = new URLSearchParams(location.search);
const SLOT = Math.min(4, Math.max(1, parseInt(query.get('slot'), 10) || 1));
const POLL_MS = 100;
const CATEGORY = { one: 'One Slider', ess: 'Essentials', adv: 'Advanced', ast: 'Assisted', ins: 'Instruments', midi: 'MIDI' };
const FORMAT = { jsfx: 'JSFX', gfx: 'GFX', vst3: 'VST3', clap: 'CLAP' };

const byStem = new Map(), byName = new Map(), byNative = new Map();
for (const p of NULL_PLUGINS) {
  byStem.set(p.s, p);
  byName.set(p.n.toLowerCase(), p);
  byNative.set((p.nn || p.n).toLowerCase(), p);
}

const $ = id => document.getElementById(id);
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
const svgNS = 'http://www.w3.org/2000/svg';
function svg(tag, attrs) {
  const e = document.createElementNS(svgNS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  return e;
}
const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));
const near = (a, b) => Math.abs(a - b) <= 1e-4 * Math.max(1, Math.abs(a), Math.abs(b));
function store(key, value) {
  try { if (value === undefined) return localStorage.getItem('nulljsfx-remote-' + key); localStorage.setItem('nulljsfx-remote-' + key, value); } catch (e) { return null; }
}

const S = {
  tracks: [],          // from the web interface: { i, name, flags, vol, pan, peak, color }
  transport: null,
  alive: '', aliveAt: 0, bridgeOk: false,
  out: null,           // from the bridge: chain of the viewed track and the open FX
  view: -1,            // track shown in the FX view (0 = master), -1 = mixer
  open: '',            // GUID of the FX open in the editor
  pendingAdd: '',      // id of an add command, to open the new FX when it appears
  held: new Map(),     // control key -> time until which the local value wins
};

// ---------------------------------------------------------------------------------------------
// Talking to REAPER: one request per poll carries the changes and fetches the state

const mixerQueue = new Map();   // web interface commands, latest per control
const bridgeQueue = new Map();  // bridge commands, resent until the bridge acknowledges them
let seq = Date.now(), sentView = '', lastSend = 0, inflight = false, fails = 0;
let opCount = 0;
const opPrefix = Math.random().toString(36).slice(2, 7).replace(/[^a-z0-9]/g, 'x');

function mixer(key, cmd) { mixerQueue.set(key, cmd); }
function bridge(key, cmd) { bridgeQueue.set(key, { cmd, sent: 0 }); }
function bridgeOnce(cmd) {
  const id = opPrefix + (++opCount);
  bridgeQueue.set('!' + id, { cmd: '!' + id + ':' + cmd, sent: 0 });
  return id;
}
function hold(key, ms) { S.held.set(key, performance.now() + (ms || 700)); }
function held(key) {
  if (bridgeQueue.has(key)) return true;
  const t = S.held.get(key);
  return t != null && t > performance.now();
}

async function poll() {
  if (inflight) return;
  inflight = true;
  const cmds = [...mixerQueue.values()];
  mixerQueue.clear();
  const now = performance.now();
  const view = S.view + ',' + (S.view >= 0 ? S.open : '');
  if (bridgeQueue.size || view !== sentView || (S.view >= 0 && now - lastSend > 2000)) {
    seq++;
    const list = [seq, 'view,' + view];
    for (const e of bridgeQueue.values()) {
      if (!e.sent) e.sent = seq;
      list.push(e.cmd);
    }
    cmds.push(`SET/EXTSTATE/${SEC}/in_${SLOT}/` + encodeURIComponent(list.join(';')));
    sentView = view;
    lastSend = now;
  }
  cmds.push('TRANSPORT', 'TRACK', `GET/EXTSTATE/${SEC}/alive`);
  if (S.view >= 0) cmds.push(`GET/EXTSTATE/${SEC}/out_${SLOT}`);
  try {
    const res = await fetch('/_/' + cmds.join(';'), { cache: 'no-store' });
    if (!res.ok) throw new Error(res.status);
    parse(await res.text());
    fails = 0;
  } catch (e) {
    if (++fails >= 3) setConnected(false);
  } finally {
    inflight = false;
  }
}

function unescape(s) {
  return s.replace(/\\(.)/g, (m, c) => (c === 'n' ? '\n' : c === 't' ? '\t' : c));
}

function parse(text) {
  const tracks = [];
  for (const line of text.split('\n')) {
    const f = line.split('\t');
    if (f[0] === 'TRACK' && f.length >= 7) {
      tracks.push({
        i: +f[1], name: f[2], flags: +f[3], vol: +f[4], pan: +f[5], peak: +f[6] / 10,
        color: f[13] != null ? +f[13] : 0,
      });
    } else if (f[0] === 'TRANSPORT') {
      S.transport = { state: +f[1], pos: +f[2], repeat: f[3] === '1', str: f[4] || '' };
    } else if (f[0] === 'EXTSTATE' && f[1] === SEC) {
      const value = unescape(f.slice(3).join('\t'));
      if (f[2] === 'alive') {
        if (value !== S.alive) { S.alive = value; S.aliveAt = performance.now(); }
      } else if (f[2] === 'out_' + SLOT && value) {
        try { gotBridge(JSON.parse(value)); } catch (e) { /* half-written or old: wait for the next */ }
      }
    }
  }
  setConnected(true);
  S.bridgeOk = S.alive !== '' && performance.now() - S.aliveAt < 3000;
  S.tracks = tracks;
  render();
}

function gotBridge(out) {
  for (const [key, e] of bridgeQueue) if (e.sent && out.ack >= e.sent) bridgeQueue.delete(key);
  if (out.added && S.pendingAdd && out.added.startsWith(S.pendingAdd + '|')) {
    S.open = out.added.slice(S.pendingAdd.length + 1);
    S.pendingAdd = '';
  }
  S.out = out;
}

function setConnected(ok) {
  $('dot').classList.toggle('ok', ok);
  $('conn').textContent = ok ? (S.bridgeOk ? 'Connected' : 'Connected, no FX bridge') : 'Offline';
}

// ---------------------------------------------------------------------------------------------
// Dragging: relative, so touching a control never makes it jump

function drag(target, { get, set, axis = 'y', range = 220, reset, tap }) {
  let start = null, lastUp = 0, moved = false;
  target.addEventListener('pointerdown', e => {
    e.preventDefault();
    target.setPointerCapture(e.pointerId);
    start = { x: e.clientX, y: e.clientY, v: get() };
    moved = false;
  });
  target.addEventListener('pointermove', e => {
    if (!start) return;
    const d = axis === 'y' ? start.y - e.clientY : e.clientX - start.x;
    if (Math.abs(d) > 3) moved = true;
    if (!moved) return;
    const r = typeof range === 'function' ? range() : range;
    set(clamp(start.v + d / r, 0, 1));
  });
  const end = e => {
    if (!start) return;
    start = null;
    if (moved) return;
    const t = performance.now();
    if (t - lastUp < 320 && reset) { reset(); lastUp = 0; }
    else { lastUp = t; if (tap) tap(e); }
  };
  target.addEventListener('pointerup', end);
  target.addEventListener('pointercancel', () => { start = null; });
}

// fader position (0..1) <-> gain: +12 dB at the top, 0 dB at about 71%
const posToGain = p => (p <= 0.001 ? 0 : 4 * p ** 4);
const gainToPos = g => (g <= 0 ? 0 : clamp((g / 4) ** 0.25, 0, 1));
const dbText = g => (g < 1e-6 ? '−inf' : (20 * Math.log10(g) >= 0 ? '+' : '') + (20 * Math.log10(g)).toFixed(1)).replace('-', '−');
const panText = p => (Math.abs(p) < 0.005 ? 'C' : Math.round(Math.abs(p) * 100) + (p < 0 ? 'L' : 'R'));

  if (i !== 0) msr.append(s.s, s.r);
  const wrap = el('div', 'fadwrap');
  s.fader = el('div', 'fader');
  s.cap = el('div', 'cap');
  s.zero = el('div', 'zero');
  s.fader.append(el('div', 'track'), s.zero, s.cap);
  s.meter = el('div', 'meter');
  s.lvl = el('div', 'lvl');
  s.meter.append(s.lvl);
  wrap.append(s.fader, s.meter);
  s.db = el('div', 'db');
  s.root.append(s.color, s.name, s.fx, s.pan, msr, wrap, s.db);

  s.vol = 1; s.panV = 0; s.peakShown = -60;
  const setVol = p => {
    s.vol = posToGain(p);
    hold('vol' + s.i);
    mixer('vol' + s.i, `SET/TRACK/${s.i}/VOL/${s.vol.toFixed(6)}`);
    drawStrip(s);
  };
  drag(s.fader, {
    get: () => gainToPos(s.vol), set: setVol, range: () => s.fader.clientHeight - 24,
    reset: () => setVol(gainToPos(1)),
  });
  const setPan = p => {
    s.panV = Math.round((p * 2 - 1) * 100) / 100;
    hold('pan' + s.i);
    mixer('pan' + s.i, `SET/TRACK/${s.i}/PAN/${s.panV}`);
    drawStrip(s);
  };
  drag(s.pan, { get: () => (s.panV + 1) / 2, set: setPan, axis: 'x', range: 160, reset: () => setPan(0.5) });
  return s;
}

function drawStrip(s) {
  const h = s.fader.clientHeight - 24;
  s.cap.style.top = 12 + (1 - gainToPos(s.vol)) * h + 'px';
  s.zero.style.top = 12 + (1 - gainToPos(1)) * h + 'px';
  s.db.textContent = dbText(s.vol);
  const p = s.panV;
  s.panFill.style.left = (p < 0 ? (1 + p) * 50 : 50) + '%';
  s.panFill.style.width = Math.abs(p) * 50 + '%';
  s.panLbl.textContent = panText(p);
}

function renderMixer() {
  const box = $('mixer');
  const seen = new Set();
  for (const t of S.tracks) {
    let s = strips.get(t.i);
    if (!s) {
      s = makeStrip(t.i);
      strips.set(t.i, s);
    }
    const at = box.children[seen.size] || null;
    if (at !== s.root) box.insertBefore(s.root, at);
    seen.add(t.i);
    s.name.textContent = t.i === 0 ? 'MASTER' : t.name || 'Track ' + t.i;
    s.root.classList.toggle('sel', !!(t.flags & 2));
    s.fx.classList.toggle('has', !!(t.flags & 4));
    s.m.classList.toggle('on', !!(t.flags & 8));
    s.s.classList.toggle('on', !!(t.flags & 16));
    s.r.classList.toggle('on', !!(t.flags & 64));
    s.color.style.background = t.color ? '#' + (t.color & 0xffffff).toString(16).padStart(6, '0') : '';
    if (!held('vol' + t.i)) s.vol = t.vol;
    if (!held('pan' + t.i)) s.panV = t.pan;
    // meter: -60..+6 dB, falls back at 30 dB/s
    const peak = clamp(t.peak, -60, 6);
    s.peakShown = Math.max(peak, s.peakShown - 3);
    const mh = s.meter.clientHeight;
    s.lvl.style.setProperty('--h', mh + 'px');
    s.lvl.style.height = ((s.peakShown + 60) / 66) * 100 + '%';
    drawStrip(s);
  }
  for (const [i, s] of strips) if (!seen.has(i)) { s.root.remove(); strips.delete(i); }
}

function renderTransport() {
  const t = S.transport;
  if (!t) return;
  $('clock').textContent = t.str;
  $('t-play').classList.toggle('on', (t.state & 1) === 1);
  $('t-pause').classList.toggle('on', (t.state & 2) === 2);
  $('t-rec').classList.toggle('on', (t.state & 4) === 4);
  $('t-loop').classList.toggle('on', t.repeat);
}

const actions = { 't-start': '40042', 't-play': '1007', 't-pause': '1008', 't-stop': '1016', 't-rec': '1013' };
for (const id in actions) $(id).addEventListener('click', () => mixer(id, actions[id]));
$('t-loop').addEventListener('click', () => mixer('loop', 'SET/REPEAT/-1'));

// ---------------------------------------------------------------------------------------------
// Recognising NULL JSFX plugins

function identify(fx) {
  const ident = (fx.ident || '').replace(/\\/g, '/').toLowerCase();
  let m = ident.match(/(?:^|\/)null_jsfx\/(gfx\/)?([a-z0-9_]+)\.jsfx$/);
  if (m) {
    const p = byStem.get(m[1] ? m[2].replace(/_gfx$/, '') : m[2]);
    if (p) return { p, fmt: m[1] ? 'gfx' : 'jsfx' };
  }
  for (const name of [fx.orig, fx.name]) {
    if (!name) continue;
    m = name.match(/^JS:\s*NULL (.+?)( GFX)?(\s+\[.*\])?$/i);
    if (m && byName.has(m[1].toLowerCase())) return { p: byName.get(m[1].toLowerCase()), fmt: m[2] ? 'gfx' : 'jsfx' };
    m = name.match(/^(VST3i?|CLAPi?|VSTi?):\s*(.+?) \(NULL JSFX\)$/i);
    if (m && byNative.has(m[2].toLowerCase())) return { p: byNative.get(m[2].toLowerCase()), fmt: m[1].toLowerCase().startsWith('clap') ? 'clap' : 'vst3' };
  }
  return null;
}

function displayName(fx) {
  const id = identify(fx);
  if (id) return id.p.n;
  return fx.name.replace(/^(JS|VST3?i?|CLAPi?|AUi?|DX|LV2i?):\s*/i, '').replace(/\s+\[.*\]$/, '');
}

// slider (as in the header) -> parameter index on the track, by name, else by position
function matchParams(p, params) {
  const norm = s => s.replace(/^-/, '').replace(/\s*\([^)]*\)\s*$/, '').trim().toLowerCase();
  const used = new Set();
  const names = params.map(q => norm(q[0]));
  return p.sl.map((sl, i) => {
    let k = names.findIndex((n, j) => n === sl[0].toLowerCase() && !used.has(j));
    if (k < 0 && i < params.length && !used.has(i) && sl[7] !== 'f') k = i;
    if (k >= 0) used.add(k);
    return k;
  });
}

// ---------------------------------------------------------------------------------------------
// Slider values (header units) <-> control position

function toPos(sl, v) {
  const [, , lo, hi, , , , fl] = sl;
  if (hi === lo) return 0;
  if (fl.includes('l') && lo > 0) return clamp(Math.log(v / lo) / Math.log(hi / lo), 0, 1);
  return clamp((v - lo) / (hi - lo), 0, 1);
}
function fromPos(sl, pos) {
  const [, , lo, hi, step, , , fl] = sl;
  let v = fl.includes('l') && lo > 0 ? lo * (hi / lo) ** pos : lo + pos * (hi - lo);
  if (step > 0) v = lo + Math.round((v - lo) / step) * step;
  return clamp(+v.toPrecision(10), Math.min(lo, hi), Math.max(lo, hi));
}
function decimals(step) {
  if (!step) return 2;
  const s = String(step);
  return s.includes('.') ? s.split('.')[1].length : 0;
}
function fmtVal(sl, v) {
  const [, unit, lo, , step, , options] = sl;
  if (options) return options[clamp(Math.round(v - lo), 0, options.length - 1)] || '';
  const n = (lo < 0 && v > 0 ? '+' : '') + v.toFixed(decimals(step)).replace('-', '−');
  return unit ? n + (unit === '%' ? '%' : ' ' + unit) : n;
}
// a JSFX reports its sliders in their own units; VST3/CLAP report 0..1
function paramValue(sl, q) {
  return near(q[2], sl[2]) && near(q[3], sl[3]) ? q[1] : sl[2] + q[4] * (sl[3] - sl[2]);
}
function sendValue(fx, k, sl, q, v) {
  const tg = S.out.track.g;
  if (near(q[2], sl[2]) && near(q[3], sl[3])) bridge(fx.g + '/' + k, `p,${tg},${fx.g},${k},${v}`);
  else bridge(fx.g + '/' + k, `n,${tg},${fx.g},${k},${((v - sl[2]) / (sl[3] - sl[2])).toPrecision(8)}`);
  hold(fx.g + '/' + k);
}

// ---------------------------------------------------------------------------------------------
// Controls

function knob(onSize) {
  const size = 76, c = size / 2, r = 30;
  const root = svg('svg', { viewBox: `0 0 ${size} ${size}`, class: 'knob' });
  const arcPath = (a0, a1) => {
    const p = a => [c + r * Math.cos(a), c + r * Math.sin(a)];
    const [x0, y0] = p(a0), [x1, y1] = p(a1);
    return `M${x0.toFixed(2)} ${y0.toFixed(2)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
  };
  const A0 = Math.PI * 0.75, A1 = Math.PI * 2.25;
  root.append(
    svg('path', { d: arcPath(A0, A1), class: 'bgarc', fill: 'none', 'stroke-width': 6, 'stroke-linecap': 'round' }),
  );
  const arc = svg('path', { class: 'arc', fill: 'none', 'stroke-width': 6, 'stroke-linecap': 'round' });
  const cap = svg('circle', { cx: c, cy: c, r: 21, fill: '#2d2b28', stroke: '#45433f' });
  const ptr = svg('line', { stroke: '#e0e0e0', 'stroke-width': 3, 'stroke-linecap': 'round' });
  root.append(arc, cap, ptr);
  return {
    root,
    draw(pos, from) {
      const a = A0 + pos * (A1 - A0), af = A0 + from * (A1 - A0);
      const lo = Math.min(a, af), hi = Math.max(a, af);
      arc.setAttribute('d', hi - lo < 0.01 ? '' : arcPath(lo, hi));
      ptr.setAttribute('x1', (c + 8 * Math.cos(a)).toFixed(2));
      ptr.setAttribute('y1', (c + 8 * Math.sin(a)).toFixed(2));
      ptr.setAttribute('x2', (c + 18 * Math.cos(a)).toFixed(2));
      ptr.setAttribute('y2', (c + 18 * Math.sin(a)).toFixed(2));
    },
  };
}

function hslider(cls) {
  const root = el('div', 'hs' + (cls ? ' ' + cls : ''));
  const fill = el('div', 'fill'), thumb = el('div', 'thumb');
  root.append(fill, thumb);
  return {
    root,
    draw(pos, from) {
      if (from > 0 && from < 1) root.classList.add('bi');
      const lo = Math.min(pos, from), hi = Math.max(pos, from);
      fill.style.left = lo * 100 + '%';
      fill.style.width = (hi - lo) * 100 + '%';
      thumb.style.left = pos * 100 + '%';
    },
  };
}

// one control for one NULL slider; returns { root, update(params) }
function nullControl(fx, p, sl, k, wide) {
  const [label, unit, lo, hi, , def, options, flags] = sl;
  const key = fx.g + '/' + k;
  const box = el('div', 'ctl');
  const lbl = el('div', 'lbl', label + (unit && unit !== '%' && !options ? ` (${unit})` : ''));
  if (flags.includes('f')) {
    box.append(lbl, el('div', 'file', 'Choose the file on the computer'));
    return { root: box, update() {} };
  }
  let q = null, v = def, draw;
  const set = nv => {
    v = nv;
    sendValue(fx, k, sl, q, v);
    draw();
  };
  if (options) {
    const shortOpts = options.length <= 6 && options.join('').length <= 40;
    let ctl;
    if (shortOpts) {
      ctl = el('div', 'seg');
      const btns = options.map((o, i) => {
        const b = el('button', '', o);
        b.addEventListener('click', () => q && set(lo + i));
        ctl.append(b);
        return b;
      });
      draw = () => btns.forEach((b, i) => b.classList.toggle('on', Math.round(v - lo) === i));
    } else {
      ctl = el('select');
      options.forEach((o, i) => ctl.append(new Option(o, String(lo + i))));
      ctl.addEventListener('change', () => q && set(+ctl.value));
      draw = () => { if (document.activeElement !== ctl) ctl.value = String(lo + Math.round(v - lo)); };
    }
    if (wide) box.classList.add('wide');
    box.append(lbl, ctl);
    return { root: box, update(params) { q = params[k]; if (q && !held(key)) v = paramValue(sl, q); draw(); } };
  }
  const val = el('div', 'val');
  const from = lo < 0 && hi > 0 ? toPos(sl, 0) : 0;
  let ctl;
  if (wide) {
    box.classList.add('wide', 'one');
    ctl = hslider();
    box.append(lbl, val, ctl.root);
    drag(ctl.root, { get: () => toPos(sl, v), set: pos => q && set(fromPos(sl, pos)), axis: 'x', range: () => ctl.root.clientWidth, reset: () => q && set(def) });
  } else {
    ctl = knob();
    box.append(ctl.root, val, lbl);
    drag(ctl.root, { get: () => toPos(sl, v), set: pos => q && set(fromPos(sl, pos)), range: 200, reset: () => q && set(def) });
  }
  draw = () => {
    ctl.draw(toPos(sl, v), from);
    val.textContent = fmtVal(sl, v);
  };
  return { root: box, update(params) { q = params[k]; if (q && !held(key)) v = paramValue(sl, q); draw(); } };
}

// a parameter of any plugin: a slider of the 0..1 value and REAPER's own text for it
function genericRow(fx, k) {
  const key = fx.g + '/' + k;
  const row = el('div', 'prow');
  const lbl = el('div', 'lbl'), val = el('div', 'val');
  const hs = hslider('small');
  row.append(lbl, hs.root, val);
  let n = 0;
  drag(hs.root, {
    get: () => n,
    set: pos => {
      n = pos;
      bridge(key, `n,${S.out.track.g},${fx.g},${k},${n.toPrecision(6)}`);
      hold(key);
      hs.draw(n, 0);
    },
    axis: 'x', range: () => hs.root.clientWidth,
  });
  return {
    root: row,
    name: () => lbl.textContent,
    update(params) {
      const q = params[k];
      if (!q) return;
      lbl.textContent = q[0];
      if (!held(key)) n = q[4];
      hs.draw(n, 0);
      val.textContent = q[5];
    },
  };
}

// ---------------------------------------------------------------------------------------------
// FX view

let chainSig = '', editor = null;

function openFx(i) {
  S.view = i;
  S.out = null;
  S.open = store('open-' + i) || '';
  chainSig = '';
  editor = null;
  $('chain').replaceChildren();
  $('editor').replaceChildren();
  $('fxview').hidden = false;
  render();
}
$('fx-back').addEventListener('click', () => {
  S.view = -1;
  S.out = null;
  $('fxview').hidden = true;
});

function fxMeta(fx) {
  const id = identify(fx);
  if (!id) return 'Third-party';
  return `NULL JSFX · ${CATEGORY[id.p.c]} · ${FORMAT[id.fmt]}`;
}

function powerIcon() {
  const s = svg('svg', { viewBox: '0 0 24 24' });
  s.append(svg('path', { d: 'M12 3v8' }), svg('path', { d: 'M6.3 7.3a8 8 0 1 0 11.4 0' }));
  return s;
}

function setOn(fx, on) {
  bridge('on' + fx.g, `on,${S.out.track.g},${fx.g},${on ? 1 : 0}`);
  hold('on' + fx.g, 1500);
  fx.on = on;
  chainSig = '';
  renderFx();
}
function fxOn(fx) {
  const pending = bridgeQueue.get('on' + fx.g);
  return pending && held('on' + fx.g) ? pending.cmd.endsWith(',1') : fx.on;
}

function renderChain() {
  const out = S.out;
  const sig = JSON.stringify(out.fx.map(f => [f.g, f.name, fxOn(f)])) + S.open;
  if (sig === chainSig) return;
  chainSig = sig;
  const box = $('chain');
  box.replaceChildren();
  if (!out.fx.length) box.append(el('div', 'empty', 'No FX on this track.'));
  for (const fx of out.fx) {
    const item = el('div', 'fxitem' + (fx.g === S.open ? ' open' : '') + (fxOn(fx) ? '' : ' off'));
    const pwr = el('button', 'pwr' + (fxOn(fx) ? ' on' : ''));
    pwr.setAttribute('aria-label', 'Bypass');
    pwr.append(powerIcon());
    pwr.addEventListener('click', e => { e.stopPropagation(); setOn(fx, !fxOn(fx)); });
    const nm = el('div', 'nm');
    nm.append(el('b', '', displayName(fx)), el('small', '', fxMeta(fx)));
    item.append(pwr, nm);
    item.addEventListener('click', () => {
      S.open = fx.g;
      store('open-' + S.view, fx.g);
      editor = null;
      render();
    });
    box.append(item);
  }
}

function buildEditor(fx, params) {
  const index = S.out.fx.indexOf(fx);
  const id = identify(fx);
  const card = el('div', 'plug');
  const head = el('div', 'head');
  const logo = svg('svg', { viewBox: '0 0 80 80', width: 30, height: 30 });
  logo.append(
    svg('rect', { x: .5, y: .5, width: 79, height: 79, rx: 12, fill: '#2d2d2d', stroke: '#4a4a4a' }),
    svg('path', { d: 'M24 20v40l32-40v40', stroke: '#9a9a9a', 'stroke-width': 6, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', fill: 'none' }),
  );
  const titles = el('div');
  titles.append(el('div', 'pname', id ? id.p.n.toUpperCase() : displayName(fx)), el('div', 'meta', id ? 'AUDIO WITHOUT NOISE · ' + CATEGORY[id.p.c] + ' · ' + FORMAT[id.fmt] : fxMeta(fx)));
  if (id) head.append(logo);
  head.append(titles);
  const tools = el('div', 'tools');
  const tg = S.out.track.g;
  const tool = (text, fn) => { const b = el('button', '', text); b.addEventListener('click', fn); tools.append(b); return b; };
  tool('Show on PC', () => bridgeOnce(`show,${tg},${fx.g}`));
  tool('◀', () => bridgeOnce(`mv,${tg},${fx.g},${index - 1}`)).disabled = index === 0;
  tool('▶', () => bridgeOnce(`mv,${tg},${fx.g},${index + 1}`)).disabled = index === S.out.fx.length - 1;
  let armed = 0;
  const del = tool('Remove', () => {
    if (performance.now() - armed < 3000) {
      bridgeOnce(`del,${tg},${fx.g}`);
      S.open = '';
      editor = null;
      return;
    }
    armed = performance.now();
    del.textContent = 'Tap again to remove';
    setTimeout(() => { del.textContent = 'Remove'; }, 3000);
  });
  head.append(tools);
  const body = el('div', 'body');
  card.append(head, body);
  const parts = [];
  if (id) {
    const map = matchParams(id.p, params);
    const grid = el('div', 'knobs');
    id.p.sl.forEach((sl, i) => {
      if (map[i] < 0 || sl[7].includes('h')) return;
      const one = id.p.c === 'one' && !sl[6] && !parts.some(c => c.wide);
      const c = nullControl(fx, id.p, sl, map[i], one || (!!sl[6] && id.p.c === 'one'));
      c.wide = one;
      parts.push(c);
      grid.append(c.root);
    });
    body.append(grid);
  }
  // every parameter (for a NULL plugin: folded away, with REAPER's Wet and Bypass too)
  const rows = params.map((q, k) => genericRow(fx, k));
  const list = el('div');
  const filter = el('input', 'filter');
  filter.type = 'search';
  filter.placeholder = 'Filter parameters';
  filter.addEventListener('input', () => {
    const f = filter.value.toLowerCase();
    rows.forEach(r => { r.root.hidden = f && !r.name().toLowerCase().includes(f); });
  });
  if (rows.length > 12) list.append(filter);
  rows.forEach(r => list.append(r.root));
  if (fx.np > params.length) list.append(el('div', 'empty', `Showing the first ${params.length} of ${fx.np} parameters.`));
  if (id) {
    const det = el('details', 'params');
    det.append(el('summary', '', 'All parameters'), list);
    body.append(det);
  } else {
    body.append(rows.length ? list : el('div', 'empty', 'This FX has no parameters.'));
  }
  parts.push(...rows);
  $('editor').replaceChildren(card);
  return { g: fx.g, n: params.length, index, count: S.out.fx.length, parts };
}

function renderEditor() {
  const out = S.out;
  const fx = out.fx.find(f => f.g === S.open);
  if (!fx) {
    editor = null;
    $('editor').replaceChildren(el('div', 'empty', out.fx.length ? 'Choose an FX on the left.' : 'Add a NULL JSFX plugin with “+ Add NULL plugin”.'));
    return;
  }
  if (!out.open || out.open.g !== fx.g) return; // the bridge has not sent its parameters yet
  const params = out.open.params;
  const index = out.fx.indexOf(fx);
  if (!editor || editor.g !== fx.g || editor.n !== params.length || editor.index !== index || editor.count !== out.fx.length) {
    editor = buildEditor(fx, params);
  }
  for (const part of editor.parts) part.update(params);
}

function renderFx() {
  const t = S.tracks.find(x => x.i === S.view);
  $('fx-title').replaceChildren(document.createTextNode(S.view === 0 ? 'MASTER' : t ? t.name || 'Track ' + t.i : 'Track ' + S.view), el('small', '', 'FX chain'));
  $('fx-add').disabled = !(S.bridgeOk && S.out && S.out.track);
  if (!S.bridgeOk) {
    chainSig = '';
    editor = null;
    $('chain').replaceChildren();
    const msg = el('div', 'empty');
    msg.innerHTML = 'The FX bridge is not running in REAPER.<br>Run <code>null_jsfx_remote_bridge.lua</code> (Actions &gt; Show action list &gt; New action &gt; Load ReaScript, then Run).';
    $('editor').replaceChildren(msg);
    return;
  }
  if (!S.out || !S.out.track || S.out.track.i !== S.view) return;
  renderChain();
  renderEditor();
}

// ---------------------------------------------------------------------------------------------
// Adding a NULL plugin

let addFormat = store('format') || 'jsfx';

function renderAdd() {
  const fmtBox = $('add-format');
  fmtBox.replaceChildren();
  for (const f in FORMAT) {
    const b = el('button', f === addFormat ? 'on' : '', FORMAT[f]);
    b.addEventListener('click', () => { addFormat = f; store('format', f); renderAdd(); });
    fmtBox.append(b);
  }
  const term = $('add-search').value.trim().toLowerCase();
  const list = $('addlist');
  list.replaceChildren();
  for (const c in CATEGORY) {
    const items = NULL_PLUGINS.filter(p => p.c === c && (!term || p.n.toLowerCase().includes(term) || p.t.includes(term)));
    if (!items.length) continue;
    list.append(el('h4', '', CATEGORY[c].toUpperCase()));
    const grid = el('div', 'addgrid');
    for (const p of items) {
      const b = el('button', '', p.n);
      b.disabled = !p.f.includes(addFormat);
      b.addEventListener('click', () => {
        S.pendingAdd = bridgeOnce(`add,${S.out.track.g},${p.s},${addFormat},${p.n.replace(/[;,]/g, ' ')}`);
        $('addsheet').hidden = true;
      });
      grid.append(b);
    }
    list.append(grid);
  }
}
$('fx-add').addEventListener('click', () => { $('add-search').value = ''; renderAdd(); $('addsheet').hidden = false; });
$('add-close').addEventListener('click', () => { $('addsheet').hidden = true; });
$('addsheet').addEventListener('click', e => { if (e.target === $('addsheet')) $('addsheet').hidden = true; });
$('add-search').addEventListener('input', renderAdd);

function render() {
  $('banner').hidden = S.bridgeOk || !S.tracks.length;
  setConnected(fails < 3);
  renderTransport();
  if (S.view >= 0) renderFx();
  else renderMixer();
}

setInterval(poll, POLL_MS);
poll();
</script>
